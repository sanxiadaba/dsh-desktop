[package]
name = "desk"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "DSH 桌面控制：UIA 观察 + 语义动作 + 后台消息注入，不抢前台"
license = "MIT"
repository = "https://github.com/sanxiadaba/dsh-desktop"
keywords = ["windows", "uia", "automation", "dsh"]
categories = ["command-line-utilities", "gui"]

[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_Xps", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_Ime", "Win32_System_Registry"] }

[profile.release]
lto = true
strip = true
