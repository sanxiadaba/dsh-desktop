name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release
      - name: static CRT
        shell: pwsh
        run: |
          $s = [System.IO.File]::ReadAllText("target\release\desk.exe")
          if ($s.Contains("VCRUNTIME140.dll")) { throw "release exe still depends on VCRUNTIME140.dll" }
      - name: package
        shell: pwsh
        run: |
          Copy-Item target\release\desk.exe desk.exe
          (Get-FileHash desk.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii desk.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            desk.exe
            desk.exe.sha256
